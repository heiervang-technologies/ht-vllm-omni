name: Fork Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_rebase:
        description: 'Only sync main, skip rebase of ht'
        type: boolean
        default: false

# Match the permissions requested by the reusable workflow (same fix as
# ht-vibe#25). GitHub forbids permission elevation across reusable calls.
permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: heiervang-technologies/.github/.github/workflows/fork-sync-reusable.yml@main
    with:
      upstream_repo: 'vllm-project/vllm-omni'
      upstream_branch: 'main'
      fork_branch: 'ht'
      # Scheduled runs only fast-forward main. A clean rebase of ht is
      # force-pushed by the reusable workflow, and ht has not synced in
      # months; rebasing stays a deliberate manual dispatch.
      skip_rebase: ${{ github.event_name == 'schedule' || inputs.skip_rebase || false }}
